---
# Blacksmith merges this with the plan manifest and a `jobs` list of the
# instance's VMs, and returns `credentials` as the binding. The broker drops
# admin_username and admin_password from the binding; they are here for a
# future per-binding user, as RabbitMQ and Valkey do it.
credentials:
  host: (( grab jobs.proxy/0.ips[0] ))
  hosts: (( grab jobs.proxy.ips ))
  port: 3306
  username: (( grab meta.admin_username ))
  password: (( grab meta.admin_password ))
  admin_username: (( grab meta.admin_username ))
  admin_password: (( grab meta.admin_password ))
  uri: (( concat "mysql://" credentials.username ":" credentials.password "@" credentials.host ":" credentials.port "/" ))
  ca_certificate: (( file "/var/vcap/jobs/blacksmith/config/tls/blacksmith_services_ca" ))
