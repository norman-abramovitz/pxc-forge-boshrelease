---
meta:
  size: default
  environment: <%= p('environment') %>
  bosh_env: <%= p('bosh_env') %>
  admin_username: admin
  admin_password: (( vault $CREDENTIALS "/admin:password" ))
  default:
    azs: [ z1 ]

variables:
- name: pxc_root_password
  type: password
- name: pxc_server_tls
  type: certificate
  options:
    ca: (( concat "/" meta.bosh_env "-bosh/" meta.environment "-blacksmith/blacksmith_services_ca" ))
    common_name: (( concat meta.environment "-pxc.bosh" ))
    alternative_names: [ localhost ]
  # Clients reach the nodes through the proxies, so the nodes' certificate
  # carries *.proxy.<network>.<deployment>.bosh, the names the binding hands out.
  consumes:
    alternative_name:
      from: pxc-san
      properties: { wildcard: true }
# Galera peers trust only their own deployment's CA, so a node of another
# instance cannot join this cluster.
- name: pxc_galera_ca
  type: certificate
  options:
    is_ca: true
    common_name: pxc_galera_ca
- name: pxc_galera_tls
  type: certificate
  options:
    ca: pxc_galera_ca
    common_name: pxc_galera_tls
    extended_key_usage: [ server_auth, client_auth ]
- name: pxc_galera_agent_endpoint_password
  type: password
- name: pxc_galera_agent_db_password
  type: password
- name: pxc_cluster_health_password
  type: password
- name: pxc_proxy_api_password
  type: password

releases:
- name: pxc
  version: "<%= p('pxc_release.version').to_s.gsub('"', '') %>"
  url: "<%= p('pxc_release.url').to_s.gsub('"', '') %>"
  sha1: "<%= p('pxc_release.sha1').to_s.gsub('"', '') %>"
- name: bpm
  version: "<%= p('bpm_release.version').to_s.gsub('"', '') %>"
  url: "<%= p('bpm_release.url').to_s.gsub('"', '') %>"
  sha1: "<%= p('bpm_release.sha1').to_s.gsub('"', '') %>"

stemcells:
- alias: default
  os: <%= p('stemcell_os') %>
  version: "<%= p('stemcell_version').to_s.gsub('"', '') %>"

# Galera nodes must roll one at a time.
update:
  canaries: 1
  canary_watch_time: 10000-600000
  update_watch_time: 10000-600000
  max_in_flight: 1
  serial: false

instance_groups:
- name: mysql
  instances: 3
  azs: (( grab meta.azs || meta.default.azs ))
  networks: [ { name: (( grab meta.net || "pxc-service" )) } ]
  stemcell: default
  vm_type: (( grab meta.size ))
  .: (( inject meta.disk_config ))
  jobs:
  - name: bpm
    release: bpm
  - name: pxc-mysql
    release: pxc
    properties:
      mysql_version: "8.4"
      admin_password: ((pxc_root_password))
      engine_config:
        galera:
          enabled: true
      tls:
        galera: ((pxc_galera_tls))
        server: ((pxc_server_tls))
        required: (( grab meta.tls_required || false ))
      seeded_users:
        admin:
          password: (( grab meta.admin_password ))
          host: any
          role: admin
  - name: galera-agent
    release: pxc
    properties:
      endpoint_password: ((pxc_galera_agent_endpoint_password))
      db_password: ((pxc_galera_agent_db_password))
  - name: cluster-health-logger
    release: pxc
    properties:
      db_password: ((pxc_cluster_health_password))
  - name: gra-log-purger
    release: pxc
  - name: bootstrap
    release: pxc

# The proxies send all traffic to one healthy node, which avoids Galera
# certification conflicts between writers.
- name: proxy
  instances: 2
  azs: (( grab meta.azs || meta.default.azs ))
  networks: [ { name: (( grab meta.net || "pxc-service" )) } ]
  stemcell: default
  vm_type: (( grab meta.proxy_size || meta.size ))
  jobs:
  - name: bpm
    release: bpm
  - name: proxy
    release: pxc
    properties:
      api_password: ((pxc_proxy_api_password))
    provides:
      pxc-san:
        as: pxc-san
        ip_addresses: false
    custom_provider_definitions:
    - name: pxc-san
      type: address
